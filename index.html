<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2B4C8C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ochiq Kirill"><meta name="description" content="Noldan (A0) tarjimonlik darajasigacha (C1) — 39 haftalik rus tili darsligi."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%95%3C/text%3E%3C/svg%3E"><title>Ochiq Kirill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">

<style>
/* ============ TOKENS ============ */
:root{
  --ink:#171A21;
  --ink-2:#3D4552;
  --ink-3:#6C7686;
  --paper:#EFF1F5;
  --surface:#FFFFFF;
  --surface-2:#F7F8FB;
  --line:#D8DCE4;
  --line-soft:#E6E9EF;
  --accent:#2B4C8C;
  --accent-soft:#E3E9F5;
  --accent-ink:#1E3A6E;
  --gold:#A97A25;
  --gold-soft:#F6EEDC;
  --good:#2C6E56;
  --good-soft:#E0EFE8;
  --warn:#A8501C;
  --warn-soft:#FAE9DE;
  --shadow:0 1px 2px rgba(23,26,33,.06),0 8px 24px -12px rgba(23,26,33,.18);
  --radius:3px;
  --measure:66ch;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"PT Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"PT Mono","SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EAF0;
    --ink-2:#AEB6C4;
    --ink-3:#7C8697;
    --paper:#12141A;
    --surface:#1A1D25;
    --surface-2:#22262F;
    --line:#333944;
    --line-soft:#282D37;
    --accent:#89A8E4;
    --accent-soft:#22304C;
    --accent-ink:#B7CBF0;
    --gold:#D8AC57;
    --gold-soft:#332A18;
    --good:#6DC4A2;
    --good-soft:#1B322A;
    --warn:#E29260;
    --warn-soft:#33231A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EAF0; --ink-2:#AEB6C4; --ink-3:#7C8697;
  --paper:#12141A; --surface:#1A1D25; --surface-2:#22262F;
  --line:#333944; --line-soft:#282D37;
  --accent:#89A8E4; --accent-soft:#22304C; --accent-ink:#B7CBF0;
  --gold:#D8AC57; --gold-soft:#332A18;
  --good:#6DC4A2; --good-soft:#1B322A;
  --warn:#E29260; --warn-soft:#33231A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ============ SHELL ============ */
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:0 0 40px;
}
.main{min-width:0;display:flex;flex-direction:column}

/* ============ RAIL ============ */
.brand{padding:22px 22px 18px;border-bottom:1px solid var(--line-soft)}
.brand h1{
  font-family:var(--serif); font-size:21px; line-height:1.15; margin:0 0 4px;
  letter-spacing:-.01em; font-weight:700;
}
.brand .sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.progress-wrap{padding:16px 22px;border-bottom:1px solid var(--line-soft)}
.progress-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-bottom:7px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s ease}

.mod{border-bottom:1px solid var(--line-soft)}
.mod-head{
  width:100%;display:flex;align-items:baseline;gap:9px;padding:11px 22px;
  background:none;border:0;cursor:pointer;text-align:left;font-family:var(--sans);
  color:var(--ink);font-size:13.5px;
}
.mod-head:hover{background:var(--surface-2)}
.mod-num{font-family:var(--mono);font-size:11px;color:var(--accent);flex:0 0 auto;letter-spacing:.02em}
.mod-name{flex:1;line-height:1.35}
.mod-wks{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:0 0 auto}
.mod-body{display:none;padding:0 0 8px}
.mod.open .mod-body{display:block}
.mod.open .mod-head{background:var(--surface-2);font-weight:700}
.wk-btn{
  width:100%;display:flex;gap:10px;align-items:baseline;padding:6px 22px 6px 40px;
  background:none;border:0;cursor:pointer;text-align:left;font-family:var(--sans);
  font-size:13px;color:var(--ink-2);line-height:1.35;
}
.wk-btn:hover{background:var(--accent-soft);color:var(--accent-ink)}
.wk-btn.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.wk-btn .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 22px}
.wk-btn.active .n{color:var(--accent)}
.wk-btn.done .n::after{content:"✓";color:var(--good);margin-left:2px}
.wk-btn.locked{opacity:.5}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:0 26px;height:52px;
}
.topbar .crumb{font-size:12px;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .crumb b{color:var(--ink);font-weight:700}
.tbtn{
  font-family:var(--sans);font-size:12.5px;padding:6px 12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);border-radius:var(--radius);cursor:pointer;white-space:nowrap;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.menu-toggle{display:none}

/* sync indicator */
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.02em}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.sync[data-s="ok"] .dot{background:var(--good)}
.sync[data-s="saving"] .dot{background:var(--gold);animation:pulse 1s infinite}
.sync[data-s="connecting"] .dot{background:var(--gold);animation:pulse 1s infinite}
.sync[data-s="off"] .dot,.sync[data-s="local"] .dot,.sync[data-s="bad"] .dot{background:var(--warn)}
.sync[data-s="device"] .dot{background:var(--ink-3)}

/* kalit tasmasi */
.keybar{background:var(--gold-soft);border-bottom:1px solid var(--line)}
.kb-in{max-width:calc(var(--measure) + 300px);margin:0 auto;padding:14px 26px;display:flex;flex-direction:column;gap:10px}
.kb-txt{font-size:14px;color:var(--ink-2);max-width:var(--measure)}
.kb-txt b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:3px}
@media (max-width:900px){.kb-in{padding:12px 18px}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (max-width:640px){.sync .lbl{display:none}}

/* ============ CONTENT ============ */
.page{padding:36px 26px 90px;max-width:calc(var(--measure) + 300px);width:100%;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
h2.wk-title{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:0 0 10px;text-wrap:balance;letter-spacing:-.015em}
.lede{font-size:16.5px;color:var(--ink-2);max-width:var(--measure);margin:0 0 22px}
.goalbox{
  background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:14px 18px;margin:0 0 32px;max-width:var(--measure);border-radius:0 var(--radius) var(--radius) 0;
}
.goalbox h4{margin:0 0 5px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-family:var(--mono)}
.goalbox p{margin:0;font-size:14.5px;color:var(--ink-2)}
.goalbox ul{margin:6px 0 0;padding-left:18px;font-size:14.5px;color:var(--ink-2)}

section.blk{margin:0 0 44px;scroll-margin-top:70px}
h3.sec{
  font-family:var(--serif);font-size:22px;margin:0 0 4px;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:11px;
}
h3.sec .tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);padding:2px 6px;border-radius:2px;flex:0 0 auto;
}
.sec-note{font-size:13px;color:var(--ink-3);margin:0 0 18px;max-width:var(--measure)}
h4.sub{font-family:var(--sans);font-size:15px;font-weight:700;margin:24px 0 8px;color:var(--ink)}
.blk p, .blk li{max-width:var(--measure)}
.blk p{margin:0 0 12px;font-size:15.5px;color:var(--ink-2)}
.blk ul,.blk ol{margin:0 0 14px;padding-left:20px;font-size:15.5px;color:var(--ink-2)}
.blk li{margin-bottom:5px}
b,strong{color:var(--ink)}
.ru{font-family:var(--serif);color:var(--ink);font-weight:700}
.tr{font-family:var(--mono);font-size:.88em;color:var(--accent)}
.uz{color:var(--ink-2);font-style:italic}

/* rule cards */
.rule{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow);max-width:var(--measure);
}
.rule.key{border-left:3px solid var(--gold);background:var(--gold-soft)}
.rule.key h5{color:var(--gold)}
.rule h5{
  margin:0 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);
}
.rule p:last-child{margin-bottom:0}

/* tables */
.tw{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{
  text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;
}
td{padding:8px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.c-ru{font-family:var(--serif);font-weight:700;white-space:nowrap}
td.c-tr{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap}
td.c-uz{color:var(--ink-2)}
.tabnum{font-variant-numeric:tabular-nums}

/* alphabet grid */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:0 0 18px}
.ltr{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 10px;cursor:pointer;text-align:left;font-family:var(--sans);color:var(--ink);
}
.ltr:hover{border-color:var(--accent);background:var(--accent-soft)}
.ltr .g{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.1}
.ltr .p{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:2px}
.ltr .h{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.ltr.sign{background:var(--surface-2)}
.ltr.vowel .g{color:var(--gold)}

/* speak button */
.say{
  border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px 4px;
  font-size:13px;line-height:1;border-radius:2px;vertical-align:middle;
}
.say:hover{color:var(--accent);background:var(--accent-soft)}
.say.playing{color:var(--accent)}

/* dialogue */
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 0;margin:0 0 18px;box-shadow:var(--shadow)}
.turn{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-soft)}
.turn:last-child{border-bottom:0}
.who{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:2px}
.turn .r{font-family:var(--serif);font-size:16.5px;font-weight:700;line-height:1.4}
.turn .t{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:2px}
.turn .u{font-size:14px;color:var(--ink-2);font-style:italic;margin-top:3px}

/* reading text */
.txbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);max-width:var(--measure)}
.tx-p{margin-bottom:14px}
.tx-p:last-child{margin-bottom:0}
.tx-ru{font-family:var(--serif);font-size:16.5px;line-height:1.65}
.tx-uz{font-size:14.5px;color:var(--ink-2);font-style:italic;margin-top:5px;padding-left:12px;border-left:2px solid var(--line)}

/* exercises */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 12px;box-shadow:var(--shadow)}
.ex-head{display:flex;gap:11px;align-items:baseline;padding:13px 18px 9px}
.ex-n{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:0 0 auto;padding-top:1px}
.ex-q{flex:1;font-size:15px;line-height:1.5}
.ex-body{padding:0 18px 14px 47px}
.ex-body.wide{padding-left:18px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.opt{
  font-family:var(--serif);font-size:15px;padding:6px 13px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:var(--radius);cursor:pointer;
}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.opt[disabled]{cursor:default}
.inp{
  font-family:var(--serif);font-size:15.5px;padding:7px 11px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:var(--radius);width:min(320px,100%);
}
.inp:focus{border-color:var(--accent)}
.inp.right{border-color:var(--good);background:var(--good-soft)}
.inp.wrong{border-color:var(--warn);background:var(--warn-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{
  font-family:var(--sans);font-size:12.5px;padding:7px 12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);border-radius:var(--radius);cursor:pointer;
}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.fb{font-size:13.5px;margin-top:8px;display:none}
.fb.show{display:block}
.fb.ok{color:var(--good)}
.fb.no{color:var(--warn)}
.fb .corr{font-family:var(--serif);font-weight:700}

/* topshiriq belgisi */
.taskbar{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);max-width:var(--measure)}
.tchk{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--sans);font-size:12.5px;
  padding:7px 13px 7px 9px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-3);border-radius:var(--radius);cursor:pointer;
}
.tchk:hover{border-color:var(--good);color:var(--good)}
.tchk .bx{
  width:16px;height:16px;border:1.5px solid var(--line);border-radius:2px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;
}
.tchk.on{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.tchk.on .bx{background:var(--good);border-color:var(--good);color:var(--surface)}
h3.sec .tag.done{border-color:var(--good);color:var(--good)}
.ex.solved{border-left:3px solid var(--good)}
.ex.solved .ex-n::after{content:"✓";color:var(--good);margin-left:3px}

/* natijalar paneli */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.pcard .v{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pcard .k{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.pcard .bar{margin-top:9px}
.pcard .bar i{background:var(--good)}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin:14px 0 0}
.wkcell{
  border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:6px 0;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:pointer;text-align:center;line-height:1.3;
}
.wkcell:hover{border-color:var(--accent);color:var(--accent)}
.wkcell .pc{display:block;font-size:9px;color:var(--ink-3);margin-top:2px}
.wkcell.part{border-color:var(--gold);color:var(--gold)}
.wkcell.full{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}

/* flashcards */
.fc-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);max-width:var(--measure)}
.fc-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:14px}
.fc-card{
  min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;text-align:center;padding:14px;background:var(--surface-2);border-radius:var(--radius);cursor:pointer;
}
.fc-front{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.2}
.fc-tr{font-family:var(--mono);font-size:14px;color:var(--accent)}
.fc-back{font-size:17px;color:var(--ink-2)}
.fc-hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.fc-btns{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}

/* syllabus */
.syl{display:grid;gap:12px;margin:0 0 20px}
.syl-mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow)}
.syl-mod header{display:flex;align-items:baseline;gap:11px;margin-bottom:8px;flex-wrap:wrap}
.syl-mod .n{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em}
.syl-mod h4{margin:0;font-family:var(--serif);font-size:18px;flex:1;min-width:180px}
.syl-mod .wks{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.syl-mod ol{margin:0;padding-left:19px;font-size:14px;color:var(--ink-2)}
.syl-mod li{margin-bottom:3px}
.syl-mod li::marker{color:var(--ink-3);font-family:var(--mono);font-size:11px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}

.footnav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:44px;flex-wrap:wrap}
.pill{
  font-family:var(--sans);font-size:13px;padding:9px 15px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:var(--radius);cursor:pointer;
}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.primary:hover{color:#fff;opacity:.92}

{t:"rule", h:"«Это» — universal ko'rsatkich", p:[
"<span class='ru'>Это</span> so'zi «bu / bular» ma'nosini beradi va <b>jins hamda songa qarab o'zgarmaydi</b>:",

{t:"rule", h:"So'roq gap tuzish — juda oson", p:[
"Rus tilida so'roq gap uchun so'z tartibi <b>o'zgarmaydi</b>, hech qanday yordamchi so'z qo'shilmaydi. Faqat <b>ovoz ohangi ko'tariladi</b>:",
"<span class='ru'>Это ваш дом.</span> (Bu sizning uyingiz.) → <span class='ru'>Это ваш дом?</span> (Bu sizning uyingizmi?)",
"So'roq so'zi bo'lsa, u gap boshiga qo'yiladi: <span class='ru'>Где ваш дом? Кто э́то? Что э́то? Как вас зову́т? Почему́ вы здесь?</span>",
"Inkor uchun fe'l yoki ot oldiga <span class='ru'>не</span> qo'yiladi: <span class='ru'>Это не мой дом.</span> — <span class='uz'>Bu mening uyim emas.</span>"
]},

"<b>I tuslanish:</b> -ю / -ешь / -ет / -ем / -ете / -ют<br><b>II tuslanish:</b> -ю / -ишь / -ит / -им / -ите / -ят",
"Diqqat qiling: <b>«я» va «вы» shakllari deyarli bir xil</b>, farq faqat ikkinchi unlida (-ете / -ите). Boshlovchilar eng ko'p shu joyda adashadi.",
"<b>Qattiq undoshdan keyingi o'zgarish:</b> ж, ш, ч, щ, к, г, х dan keyin «ю» → «у», «я» → «а» bo'ladi. Shuning uchun: <span class='ru'>я пиш<b>у́</b>, они́ пи́ш<b>ут</b></span> (I tusl.); <span class='ru'>я слы́ш<b>у</b>, они́ слы́ш<b>ат</b></span> (II tusl.)."
]},

{t:"rule", k:true, h:"Undosh almashuvi — qo'rqmang, tizimli", p:[
"Ba'zi fe'llarda o'zakning oxirgi undoshi o'zgaradi. Bu tasodifiy emas, aniq juftliklar bor:",
"<b>с→ш:</b> писа́ть → я пишу́ · <b>з→ж:</b> сказа́ть → я скажу́ · <b>д→ж:</b> ви́деть → я ви́жу, ходи́ть → я хожу́ · <b>т→ч:</b> плати́ть → я плачу́ · <b>ст→щ:</b> прости́ть → я прощу́ · <b>к→ч:</b> плака́ть → я пла́чу.",
"<b>Muhim:</b> almashuv <b>faqat «я» shaklida</b> sodir bo'ladi (I tuslanishda esa barcha shakllarda). Qiyoslang: <span class='ru'>я плачу́ — ты пла́тишь — он пла́тит</span>.",
"<b>Б, П, В, Ф, М dan keyin «л» qo'shiladi</b> — faqat «я» shaklida: люби́ть → я лю<b>бл</b>ю́ · купи́ть → я ку<b>пл</b>ю́ · гото́вить → я гото́<b>вл</b>ю."
]},

{t:"rule", h:"«хоте́ть» va «мочь» — aralash fe'llar", p:[
"Jadvalning oxirgi ikki qatoriga diqqat qiling. <span class='ru'>хоте́ть</span> birlikda I tuslanish (хо́чешь, хо́чет), ko'plikda II tuslanish (хоти́м, хоти́те, хотя́т) qo'shimchalarini oladi. Rus tilida bunday fe'l atigi to'rtta: <span class='ru'>хоте́ть, бежа́ть, есть, дать</span>. Ular «raznospryagayemye» deb ataladi.",
"<span class='ru'>мочь</span> da esa о → ж → г almashuvi bor: могу́ — мо́жешь — мо́гут. Bu ikkalasi kundalik nutqda juda tez-tez keladi, shuning uchun ularni alohida, yoddan mashq qiling."
]},

{t:"rule", h:"Qo'shma sonlar va «bir» ning uch shakli", p:[
"Qo'shma sonlar shunchaki yonma-yon qo'yiladi: 21 = <span class='ru'>два́дцать оди́н</span>, 47 = <span class='ru'>со́рок семь</span>, 99 = <span class='ru'>девяно́сто де́вять</span>. Hech qanday bog'lovchi qo'shilmaydi.",
"<b>«1» va «2» otning jinsiga moslashadi:</b> <span class='ru'>оди́н стол</span> (erk.), <span class='ru'>одна́ кни́га</span> (ayol), <span class='ru'>одно́ окно́</span> (o'rta); <span class='ru'>два стола́</span> (erk./o'rta), <span class='ru'>две кни́ги</span> (ayol). Qolgan sonlar o'zgarmaydi.",
"Sondan keyingi otning shakli (два стол<b>а́</b>, пять стол<b>о́в</b>) kelishiklarga bog'liq — uni <b>4-modulda</b> to'liq ochamiz. Hozircha faqat sanashni mustahkamlang."
]},

{t:"rule", k:true, h:"«У меня́ есть...» — egalikni ifodalash", p:[
"Rus tilida «menda bor» degan alohida fe'l yo'q. Uning o'rniga <b>у + shaxs + есть + narsa</b> qolipi ishlatiladi. Bu qolip o'zbek tilidagi «mening ...m bor» ga to'liq mos keladi.",
"<span class='ru'>У меня́ есть маши́на.</span> — <span class='uz'>Mening mashinam bor.</span><br><span class='ru'>У тебя́ есть вре́мя?</span> — <span class='uz'>Sening vaqting bormi?</span><br><span class='ru'>У нас есть вопро́с.</span> — <span class='uz'>Bizda savol bor.</span>",
"<b>Inkor shakli boshqacha:</b> «есть» o'rniga <span class='ru'>нет</span> keladi va narsa nomi o'zgaradi (Родительный kelishigi — 6-haftada): <span class='ru'>У меня́ нет вре́мени.</span> — <span class='uz'>Mening vaqtim yo'q.</span> Hozircha bu iborani butun holda yodlang."
]},

{t:"prose", h:"Kelishik nima va nega u rus tilining yuragi", p:[

"Bu bir jihatdan qulay: rus tilida so'z tartibi erkin, chunki kim nima qilayotgani <b>oxirgi harflardan</b> ma'lum. «Ма́ма лю́бит дочь» va «Дочь лю́бит ма́ма» — birinchisida ona sevadi, ikkinchisida ham ona sevadi, chunki «дочь» shakli o'zgarmagan. Kelishiklarni bilmasangiz, gapni noto'g'ri tushunasiz.",
"Bu haftada birinchisini — eng oddiysini — o'rganamiz. Qolgan 5 tasi 2-va 3-modullarda, har biriga alohida hafta ajratilgan holda beriladi."
]},

{t:"rule", h:"Shaklni tanlash — 3 qadamli algoritm", p:[
"<b>1-qadam:</b> Otning jinsini aniqlang (2-haftadagi qoida).<br><b>2-qadam:</b> Sifatning o'zagi qanday undosh bilan tugashiga qarang.<br><b>3-qadam:</b> Jadvaldan mos shaklni oling.",
"<b>«7 harf qoidasi» yana ishlaydi:</b> к, г, х, ж, ш, щ, ч dan keyin «ы» o'rniga «и» yoziladi. Shuning uchun <span class='ru'>ру́сск<b>ий</b></span> (ру́сскый emas) va <span class='ru'>ру́сск<b>ие</b></span> (ру́сскые emas). Xuddi shu sabab: <span class='ru'>хоро́ший, большо́й → больши́е, ма́ленький → ма́ленькие</span>.",
"<b>Urg'u qoidasi:</b> agar sifatning oxiriga urg'u tushsa, erkak shakli <b>-ой</b> bo'ladi: <span class='ru'>большо́й, плохо́й, молодо́й, дорого́й</span>. Urg'u o'zakda bo'lsa — <b>-ый/-ий</b>: <span class='ru'>но́вый, ста́рый, кра́сный</span>."
]},

{t:"rule", h:"«Како́й?» — «Qanday?» savoli", p:[
"Bu savol so'zi ham sifat kabi moslashadi: <span class='ru'>Како́й дом? Кака́я кни́га? Како́е окно́? Каки́е дома́?</span>",
"Javob to'liq gap bilan beriladi: <span class='ru'>— Кака́я э́то кни́га? — Э́то но́вая кни́га.</span>",
"Farqlang: <b>«како́й?»</b> = qanday (sifat so'raydi), <b>«что?»</b> = nima (otni so'raydi), <b>«чей?»</b> = kimniki (egalikni so'raydi: <span class='ru'>чей дом? чья кни́га? чьё окно́? чьи де́ти?</span>)."
]},

{t:"rule", k:true, h:"Sifatdan ravish yasash — juda oson", p:[
"Sifatning oxirini <b>-о</b> ga almashtirsangiz, ravish hosil bo'ladi:",
"<span class='ru'>хоро́ший</span> (yaxshi — sifat) → <span class='ru'>хорошо́</span> (yaxshi — ravish)<br><span class='ru'>плохо́й</span> → <span class='ru'>пло́хо</span> · <span class='ru'>бы́стрый</span> → <span class='ru'>бы́стро</span> · <span class='ru'>ме́дленный</span> → <span class='ru'>ме́дленно</span> · <span class='ru'>пра́вильный</span> → <span class='ru'>пра́вильно</span>",
"Farqi: <b>sifat otni</b> ta'riflaydi (<span class='ru'>хоро́ший бухга́лтер</span> — yaxshi buxgalter), <b>ravish fe'lni</b> ta'riflaydi (<span class='ru'>он рабо́тает хорошо́</span> — u yaxshi ishlaydi). Ravish hech qachon o'zgarmaydi — bu sovg'a."
]},

{t:"rule", h:"So'z tartibi: erkin, lekin bemaqsad emas", p:[
"Kelishiklar tufayli rus tilida so'z tartibi erkin. Lekin u ma'nosiz emas: <b>gapning oxiridagi so'z eng muhim (yangi) axborotni</b> tashiydi.",
"<span class='ru'>Бухга́лтер пи́шет <b>отчёт</b>.</span> — (nima yozadi?) Buxgalter <b>hisobot</b> yozadi.<br><span class='ru'>Отчёт пи́шет <b>бухга́лтер</b>.</span> — (kim yozadi?) Hisobotni <b>buxgalter</b> yozadi.",

]},

{t:"prose", h:"1-modul yakunlandi — nima o'zgardi", p:[
"Siz endi: kirill alifbosini erkin o'qiysiz va yozasiz; har qanday otning jinsi va ko'pligini aniqlaysiz; 1500 dan ortiq fe'lni ikki qolip yordamida tuslay olasiz; 0–100 sanaysiz; o'zingiz, oilangiz va ishingiz haqida oddiy gaplar tuzasiz. Faol lug'atingiz — <b>396 ta takrorlanmas so'z</b> (jadvallardagi ba'zi so'zlar ataylab qayta uchraydi — bu takrorlash uchun).",
"<b>2-modulda</b> rus tilining eng katta to'sig'iga — kelishiklar tizimiga kirasiz. Har bir kelishikka bir hafta ajratilgan, shuning uchun shoshilmaslik mumkin. 2-modul oxirida siz do'konda, ko'chada, transportda va ofisda erkin muomala qila olasiz.",
"<b>Modullar orasida 2 kun dam oling</b> — lekin dam olish kunlarida ham kuniga 20 daqiqa rus tilida biror narsa tinglang. Miya o'rganganini aynan tanaffusda mustahkamlaydi."
]}

{t:"prose", h:"Винительный nima uchun kerak", p:[
"O'zbek tilida «Men <b>kitobni</b> o'qiyman» va «Men <b>do'konga</b> boraman» — ikki xil qo'shimcha (-ni va -ga). Rus tilida ikkalasi ham bitta kelishik bilan beriladi: <span class='ru'>Я чита́ю кни́г<b>у</b></span> va <span class='ru'>Я иду́ <b>в</b> магази́н</span>.",
"Demak Винительный ikki vazifani bajaradi: <b>1)</b> fe'l ta'siridagi to'g'ri to'ldiruvchi (nimani? kimni?), <b>2)</b> predlog bilan birga — harakat yo'nalishi (qayerga?)."
]},

{t:"rule", k:true, h:"«Где?» va «Куда́?» — kursning eng muhim juftligi", p:[
"Bir xil predloglar (<span class='ru'>в</span>, <span class='ru'>на</span>) ikki xil kelishik bilan keladi va ma'no butunlay o'zgaradi:",
"<b>Куда́? (qayerga — harakat)</b> → <b>Винительный</b>: <span class='ru'>Я иду́ <b>в магази́н</b>. Я е́ду <b>на рабо́ту</b>.</span>",
"<b>Где? (qayerda — joy)</b> → <b>Предложный</b>: <span class='ru'>Я <b>в магази́не</b>. Я <b>на рабо́те</b>.</span>",
"Uchinchi a'zosi ham bor (6-haftadan): <b>Отку́да? (qayerdan)</b> → <b>из / с + Родительный</b>: <span class='ru'>Я иду́ <b>из магази́на</b>. Я иду́ <b>с рабо́ты</b>.</span>",
"<b>Qoida:</b> agar joy «в» bilan bo'lsa — chiqish «из» bilan; agar «на» bilan bo'lsa — chiqish «с» bilan. <span class='ru'>в о́фис → в о́фисе → из о́фиса</span>; <span class='ru'>на по́чту → на по́чте → с по́чты</span>."
]},

"<b>Maslahat:</b> 3-modulga o'tishdan oldin bir kun faqat 2-modulni takrorlashga ajrating — beshta kelishik jadvalini yoddan chizib chiqing va 50 ta gapda sinab ko'ring."

{t:"rule", k:true, h:"Qaysi vidni tanlash — amaliy algoritm", p:[
"<b>НСВ ni tanlang, agar:</b><br>• jarayonni tasvirlayotgan bo'lsangiz — <span class='ru'>Я <b>чита́л</b> два часа́.</span><br>• harakat takrorlanadigan bo'lsa — <span class='ru'>Я <b>проверя́ю</b> счета́ ка́ждый ме́сяц.</span><br>• shunchaki faktni aytayotgan bo'lsangiz — <span class='ru'>Вы <b>чита́ли</b> э́тот отчёт?</span> (o'qiganmisiz umuman)<br>• «долго, часто, обычно, всегда, иногда, каждый день» so'zlari bo'lsa.",

{t:"prose", h:"3-modul yakunlandi", p:[
"Siz endi rus tilining <b>butun asosiy grammatik skeletini</b> bilasiz: olti kelishik birlik va ko'plikda, uch zamon va ikki vid. Bu — A2 darajaning to'liq qamrovi va B1 ga o'tish nuqtasi. Lug'at jadvallarida jami <b>880 ta takrorlanmas so'z</b>.",

{t:"text", h:"O'qish matni — «Наш но́вый клие́нт»", note:"Matndagi har bir «который» ni topib, uning shakli nega shunday ekanini tushuntiring.", ru:[
 "На про́шлой неде́ле к нам пришёл но́вый клие́нт — компа́ния, кото́рая занима́ется поста́вкой обору́дования.",
 "Дире́ктор, с кото́рым мы встре́тились, объясни́л, что им ну́жен бухга́лтер для веде́ния учёта.",
 "Мы посмотре́ли докуме́нты, кото́рые они́ принесли́, и уви́дели, что в отчётах, кото́рые они́ сдава́ли ра́ньше, есть оши́бки.",
 "Я сказа́л, что мы мо́жем испра́вить э́ти оши́бки, но для э́того ну́жен догово́р, в кото́ром бу́дут ука́заны все усло́вия.",
 "Клие́нт согласи́лся, и мы договори́лись, что́бы он присла́л все докуме́нты до пя́тницы."
], uz:[
 "O'tgan hafta bizga yangi mijoz keldi — uskuna yetkazib berish bilan shug'ullanadigan kompaniya.",
 "Biz uchrashgan direktor, ularga hisob yuritish uchun buxgalter kerakligini tushuntirdi.",
 "Biz ular olib kelgan hujjatlarni ko'rdik va ilgari topshirgan hisobotlarida xatolar borligini ko'rdik.",
 "Men bu xatolarni tuzata olishimizni aytdim, lekin buning uchun barcha shartlar ko'rsatilgan shartnoma kerak.",
 "Mijoz rozi bo'ldi va biz u barcha hujjatlarni jumagacha yuborishi haqida kelishdik."
]},

], uz:[

]},

 "Перви́чные учётные докуме́нты принима́ются к учёту при нали́чии всех обяза́тельных реквизи́тов: наименова́ния докуме́нта, да́ты, содержа́ния хозя́йственной опера́ции и по́дписей отве́тственных лиц.",

], uz:[
 "Tashkilotda buxgalteriya hisobi rahbar tomonidan tasdiqlangan ishchi hisoblar rejasini qo'llagan holda ikki yozuv usulida yuritiladi.",

{t:"text", h:"O'qish matni — soliq idorasidan xat", note:"Bu — tipik «требование» matni. Har bir klishe iborani ajratib oling.", ru:[
 "По результа́там ка́меральной нало́говой прове́рки нало́говой деклара́ции по НДС за второ́й кварта́л теку́щего го́да устано́влено расхожде́ние ме́жду да́нными деклара́ции и све́дениями, име́ющимися у нало́гового о́ргана.",
 "В соотве́тствии со статьёй 145 Нало́гового ко́декса вам необходи́мо предста́вить поясне́ния и́ли внести́ соотве́тствующие исправле́ния в тече́ние пяти́ рабо́чих дней со дня получе́ния настоя́щего тре́бования.",
 "В слу́чае непредставле́ния поясне́ний в устано́вленный срок вы мо́жете быть привлечены́ к отве́тственности в ви́де штра́фа.",
 "Обраща́ем ва́ше внима́ние, что на су́мму недои́мки начисля́ется пе́ня за ка́ждый календа́рный день просро́чки.",
 "Реше́ние нало́гового о́ргана мо́жет быть обжа́ловано в вышестоя́щий о́рган и́ли в суд в поря́дке, устано́вленном законода́тельством."
], uz:[
 "Joriy yilning ikkinchi choragi uchun QQS bo'yicha soliq deklaratsiyasining kameral soliq tekshiruvi natijalari bo'yicha deklaratsiya ma'lumotlari va soliq organidagi ma'lumotlar o'rtasida nomuvofiqlik aniqlandi.",
 "Soliq kodeksining 145-moddasiga muvofiq sizga ushbu talabnoma olingan kundan boshlab besh ish kuni ichida izohlar taqdim etish yoki tegishli tuzatishlar kiritish zarur.",
 "Belgilangan muddatda izohlar taqdim etilmagan taqdirda siz jarima ko'rinishida javobgarlikka tortilishingiz mumkin.",
 "E'tiboringizni qaratamizki, qarzdorlik summasiga kechikkan har bir kalendar kun uchun penya hisoblanadi.",
 "Soliq organining qarori qonunchilikda belgilangan tartibda yuqori turuvchi organga yoki sudga shikoyat qilinishi mumkin."
]},

{t:"rule", k:true, h:"Shartnomaning kirish qismi — standart matn", p:[
"Har bir rus shartnomasi deyarli bir xil jumla bilan boshlanadi. Uni yodlab olsangiz, har qanday shartnomaning boshini bir soniyada tushunasiz:",
"<span class='ru'>ООО «Ромашка», именуемое в дальне́йшем «Заказчик», в лице́ дире́ктора Ивано́ва И.И., де́йствующего на основа́нии Уста́ва, с одно́й стороны́, и ООО «Стро́йка», именуемое в дальне́йшем «Исполни́тель», в лице́ дире́ктора Петро́ва П.П., де́йствующего на основа́нии Уста́ва, с друго́й стороны́, заключи́ли настоя́щий догово́р о нижесле́дующем:</span>",
"<b>Kalit iboralar:</b> <span class='ru'>именуемое в дальне́йшем</span> (keyingi o'rinlarda ... deb ataluvchi), <span class='ru'>в лице́</span> (... shaxsida), <span class='ru'>де́йствующего на основа́нии</span> (... asosida ish yurituvchi), <span class='ru'>с одно́й / с друго́й стороны́</span> (bir tomondan / boshqa tomondan), <span class='ru'>о нижесле́дующем</span> (quyidagilar haqida).",
"<b>Tomonlarning nomlari:</b> <span class='ru'>Зака́зчик</span> (buyurtmachi) — <span class='ru'>Исполни́тель</span> (ijrochi); <span class='ru'>Продаве́ц</span> (sotuvchi) — <span class='ru'>Покупа́тель</span> (xaridor); <span class='ru'>Поставщи́к</span> (yetkazib beruvchi) — <span class='ru'>Заказчик</span>; <span class='ru'>Арендода́тель</span> (ijaraga beruvchi) — <span class='ru'>Аренда́тор</span> (ijarachi)."
]},

{t:"text", h:"O'qish matni — shartnoma bandlari", note:"Bu bandlar deyarli har bir shartnomada bir xil. Ularni yodlab olsangiz, tarjima tezligingiz bir necha barobar oshadi.", ru:[
 "1.1. Исполни́тель обязу́ется оказа́ть Зака́зчику услу́ги по веде́нию бухга́лтерского учёта, а Зака́зчик обязу́ется приня́ть и оплати́ть ука́занные услу́ги.",
 "3.2. Опла́та произво́дится Зака́зчиком ежеме́сячно, не поздне́е 10-го числа́ ме́сяца, сле́дующего за отчётным, путём перечисле́ния де́нежных средств на расчётный счёт Исполни́теля.",
 "5.1. За наруше́ние сро́ков опла́ты Зака́зчик упла́чивает Исполни́телю пе́ню в разме́ре 0,1 проце́нта от неопла́ченной су́ммы за ка́ждый день просро́чки.",
 "6.1. Сто́роны освобожда́ются от отве́тственности за части́чное и́ли по́лное неисполне́ние обяза́тельств, е́сли оно́ яви́лось сле́дствием обстоя́тельств непреодоли́мой си́лы.",
 "8.3. Догово́р мо́жет быть расто́ргнут досро́чно по соглаше́нию сторо́н и́ли в односторо́ннем поря́дке при усло́вии пи́сьменного уведомле́ния друго́й стороны́ не поздне́е чем за три́дцать дней."
], uz:[
 "1.1. Ijrochi Buyurtmachiga buxgalteriya hisobini yuritish bo'yicha xizmatlar ko'rsatish majburiyatini oladi, Buyurtmachi esa ko'rsatilgan xizmatlarni qabul qilish va to'lash majburiyatini oladi.",
 "3.2. To'lov Buyurtmachi tomonidan har oy, hisobot davridan keyingi oyning 10-sanasidan kechiktirmay, pul mablag'larini Ijrochining hisob raqamiga o'tkazish yo'li bilan amalga oshiriladi.",
 "5.1. To'lov muddatlarini buzganlik uchun Buyurtmachi Ijrochiga har bir kechikkan kun uchun to'lanmagan summaning 0,1 foizi miqdorida penya to'laydi.",
 "6.1. Agar majburiyatlarning qisman yoki to'liq bajarilmasligi yengib bo'lmas kuch holatlari oqibati bo'lsa, Tomonlar javobgarlikdan ozod qilinadilar.",
 "8.3. Shartnoma tomonlarning kelishuviga binoan yoki bir tomonlama tartibda, boshqa tomonni kamida o'ttiz kun oldin yozma ravishda xabardor qilish sharti bilan muddatidan oldin bekor qilinishi mumkin."
]},

{t:"rule", k:true, h:"Farq 1 — so'z tartibi", p:[
"<b>Rus tili:</b> ega — kesim — to'ldiruvchi (erkin tartib). <b>O'zbek tili:</b> ega — to'ldiruvchi — kesim (qat'iy: fe'l oxirda).",
"<span class='ru'>Бухга́лтер <b>соста́вил</b> отчёт.</span> → «Buxgalter hisobotni <b>tuzdi</b>.»",
"Uzun jumlada bu farq juda sezilarli:<br><span class='ru'>Коми́ссия <b>при́няла</b> реше́ние о необходи́мости проведе́ния дополни́тельной прове́рки.</span> → «Komissiya qo'shimcha tekshiruv o'tkazish zarurligi to'g'risida qaror <b>qabul qildi</b>.»",
"<b>Amaliy usul:</b> rus jumlasini o'qib, avval <b>kesimni toping</b>, uni o'zbekcha jumlaning oxiriga qo'ying, keyin qolganini oldiga tering."
]},

{t:"rule", k:true, h:"Farq 2 — Родительный zanjiri teskari o'qiladi", p:[
"Rus tilida aniqlovchi <b>keyin</b>, o'zbek tilida <b>oldin</b> keladi. Uzun zanjirda tartib to'liq teskari:",
"<span class='ru'>срок <b>предоставле́ния</b> <b>отчётности</b> <b>организа́ции</b></span> → «<b>tashkilot</b> <b>hisoboti</b>ni <b>taqdim etish</b> muddati»",
"<span class='ru'>реше́ние <b>суда́</b> <b>о взыска́нии</b> <b>задо́лженности</b></span> → «<b>qarzni undirish</b> to'g'risidagi <b>sud</b> qarori»",
"<b>Amaliy usul:</b> zanjirni <b>oxiridan boshiga</b> qarab o'qing. Rus tilida birinchi so'z — asosiy ot, o'zbekchada u <b>oxirida</b> turadi.",
"<b>Mashq:</b> <span class='ru'>отчёт бухга́лтера компа́нии клие́нта</span> → «mijoz kompaniyasi buxgalterining hisoboti»."
]},

{t:"rule", h:"Farq 3 — predlog ↔ qo'shimcha", p:[
"Rus tilida <b>predlog + kelishik</b>, o'zbek tilida <b>qo'shimcha</b> yoki ko'makchi. Ular bir-biriga to'g'ridan-to'g'ri mos kelmaydi:",
"<span class='ru'><b>в</b> ба́нк<b>е</b></span> → «bank<b>da</b>» · <span class='ru'><b>в</b> ба́нк</span> → «bank<b>ka</b>» · <span class='ru'><b>из</b> ба́нк<b>а</b></span> → «bank<b>dan</b>»",
"<span class='ru'><b>с</b> клие́нт<b>ом</b></span> → «mijoz <b>bilan</b>» · <span class='ru'><b>для</b> клие́нт<b>а</b></span> → «mijoz <b>uchun</b>» · <span class='ru'><b>о</b> клие́нт<b>е</b></span> → «mijoz <b>haqida</b>»",
"<b>Xavfli joy:</b> rus predlogi ba'zan o'zbekchada <b>umuman tarjima qilinmaydi</b>: <span class='ru'>подписа́ть <b>у</b> дире́ктора</span> → «direktorga imzolatmoq» (predlogsiz konstruksiya)."
]},

{t:"rule", h:"Ism va tashkilot nomlari", p:[

{t:"rule", k:true, h:"Glossariy — professional tarjimonning asosiy quroli", p:[

{t:"rule", k:true, h:"Ketma-ket tarjimaning ish sxemasi", p:[
"<b>1. Notiq gapiradi</b> (odatda 20–40 soniya, 2–5 jumla) — tarjimon <b>tinglaydi va qayd qiladi</b>.",
"<b>2. Notiq to'xtaydi</b> — tarjimon <b>o'giradi</b>, qaydiga qarab.",
"<b>3. Takrorlanadi.</b>",
"<b>Asosiy qoida:</b> tarjimon <b>so'zlarni emas, ma'noni</b> eslab qoladi. Qayd — bu stenogramma emas, <b>xotira uchun ilgak</b>.",
"<b>Nutq uzunligi:</b> agar notiq juda uzun gapirsa, tarjimon <b>to'xtatishga haqli</b>: <span class='ru'>Прости́те, я переведу́ э́ту часть.</span> — Kechirasiz, shu qismini o'girib olay.",
"<b>Vaqt nisbati:</b> tarjima odatda asl nutqdan <b>biroz qisqaroq</b> bo'ladi (siqish tufayli), lekin ma'no to'liq saqlanadi."
]},

{t:"rule", k:true, h:"Tarjimonlik qisqartirib yozish — 5 tamoyil", p:[
"<b>1. Vertikal joylashuv.</b> Har bir fikr yangi qatordan, chapdan o'ngga siljib. Ega — chapda, kesim — o'rtada, to'ldiruvchi — o'ngda. Ko'z bir qarashda tuzilmani ko'radi.",
"<b>2. Belgilar so'zlardan ustun.</b> <b>↑</b> — o'sish, <b>↓</b> — pasayish, <b>→</b> — natija/yo'nalish, <b>=</b> — tenglik, <b>≠</b> — farq, <b>+</b> — qo'shimcha, <b>!</b> — muhim, <b>?</b> — savol, <b>Ø</b> — yo'q, <b>&</b> — va.",
"<b>3. Qisqartmalar.</b> So'zning birinchi va oxirgi harflari: <b>дгвр</b> (догово́р), <b>отч</b> (отчёт), <b>нлг</b> (нало́г), <b>клнт</b> (клие́нт). Unlilarni tashlab, undoshlarni qoldiring.",
"<b>4. Raqamlar — darhol va aniq.</b> Raqam eshitilishi bilan yoziladi, boshqa hech narsa bilan chalg'imasdan. Bu — eng ko'p xato qilinadigan joy.",
"<b>5. Bog'lanish belgilari.</b> Gaplar orasidagi mantiqni belgilar bilan ko'rsating: <b>∵</b> (chunki), <b>∴</b> (shuning uchun), <b>но</b> yoki <b>≠</b> (lekin)."
]},

{t:"text", h:"O'qish matni — jonli ishchi suhbat", note:"Bu — rasmiy bo'lmagan, lekin ishchi muhitdagi suhbat. Frazeologizmlarni toping.", ru:[

 "— Почти́. Он снача́ла поста́вил вопро́с ребро́м по цене́, но пото́м пошёл навстре́чу.",
 "— Ну и сла́ва бо́гу. А то я уже́ ду́мал, что всё э́то ви́лами по воде́ пи́сано.",

 "— Тогда́ бери́ быка́ за рога́ — гото́вь догово́р, пока́ он не переду́мал.",
 "— Уже́ гото́влю. Ду́маю, к пя́тнице де́ло бу́дет в шля́пе."
], uz:[

 "— Tayyorlayapman. O'ylaymanki, jumagacha ish bitadi."
]},

{t:"text", h:"Yakuniy o'qish matni — kompleks", note:"Bu matn kursning barcha grammatik hodisalarini o'z ichiga oladi. Uni lug'atsiz tushunsangiz — C1 darajaga yetgansiz.", ru:[
 "На основа́нии предста́вленных организа́цией докуме́нтов и в соотве́тствии с де́йствующим нало́говым законода́тельством нало́говый о́рган, рассмотре́в материа́лы ка́меральной прове́рки, при́нял реше́ние об отка́зе в привлече́нии налогоплате́льщика к отве́тственности.",
 "При э́том бы́ло устано́влено, что расхожде́ния, вы́явленные в хо́де прове́рки, но́сят техни́ческий хара́ктер и не привели́ к заниже́нию су́ммы нало́га, подлежа́щей упла́те в бюдже́т.",
 "Учи́тывая изло́женное, а та́кже принима́я во внима́ние своевре́менное предоставле́ние налогоплате́льщиком поясне́ний, о́рган счёл возмо́жным ограни́читься предупрежде́нием.",
 "Одна́ко организа́ции реко́мендовано усили́ть вну́тренний контро́ль за оформле́нием перви́чных учётных докуме́нтов, посколь́ку повто́рное наруше́ние повлечёт примене́ние штрафны́х са́нкций.",
 "Настоя́щее реше́ние мо́жет быть обжа́ловано в вышестоя́щий нало́говый о́рган в тече́ние тридцати́ дней со дня его́ получе́ния."
], uz:[
 "Tashkilot tomonidan taqdim etilgan hujjatlar asosida va amaldagi soliq qonunchiligiga muvofiq soliq organi kameral tekshiruv materiallarini ko'rib chiqib, soliq to'lovchini javobgarlikka tortishni rad etish to'g'risida qaror qabul qildi.",
 "Shu bilan birga, tekshiruv davomida aniqlangan nomuvofiqliklar texnik xususiyatga ega ekani va byudjetga to'lanishi lozim bo'lgan soliq summasining kamayishiga olib kelmagani aniqlandi.",
 "Bayon etilganlarni hisobga olib, shuningdek soliq to'lovchining izohlarni o'z vaqtida taqdim etganini e'tiborga olib, organ ogohlantirish bilan cheklanishni mumkin deb topdi.",
 "Biroq tashkilotga birlamchi hisob hujjatlarini rasmiylashtirish ustidan ichki nazoratni kuchaytirish tavsiya etildi, chunki takroriy buzilish jarima sanksiyalarini qo'llashga olib keladi.",
 "Ushbu qaror olingan kundan boshlab o'ttiz kun ichida yuqori turuvchi soliq organiga shikoyat qilinishi mumkin."
]},

/* ---------- helpers ---------- */
const AC = "́";
const stress = s => String(s).replace(/\*(.)/g, (m,c)=>c+AC);
const plain  = s => String(s).replace(/\*/g,"").replace(new RegExp(AC,"g"),"");
const esc    = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const norm   = s => plain(s).toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]/gi,"");

/* ============================================================
   HOLAT: lokal nusxa + onlayn baza (artifact db)
   done  — tugatilgan haftalar          [1,2,...]
   tasks — belgilangan topshiriqlar      {"w3.b5":1}
   exok  — to'g'ri ishlangan mashqlar    {"w3":[0,2,7]}
   known — flashkartda bilingan so'zlar  {"w3":[0,4]}
   ============================================================ */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("ok_"+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("ok_"+k, JSON.stringify(v)); }catch(e){} }
};
let done  = store.get("done", []);
let known = store.get("known", {});
let tasks = store.get("tasks", {});
let exok  = store.get("exok", {});
let LTS   = store.get("ts", 0);          // oxirgi lokal o'zgarish vaqti

/* ============================================================
   ONLAYN SAQLASH — GitHub Gist orqali
   Kalit (token) brauzerda saqlanadi; ma'lumot GitHub'dagi
   yashirin gist ichida turadi. Istalgan qurilma, istalgan
   brauzer: kalitni bir marta kiritsangiz — o'sha holat.
   ============================================================ */
const GIST_TAG  = "OCHIQ-KIRILL-PROGRESS-v1";
const GIST_FILE = "progress.json";
const GH = { tok:null, id:null, timer:null, busy:false, again:false, state:"device" };

function setSync(s, note){
  GH.state = s;
  const el = document.getElementById("syncBtn");
  if(!el) return;
  const L = { connecting:"ulanmoqda", ok:"saqlandi", saving:"saqlanmoqda",
              off:"ulanmadi", device:"shu qurilmada", bad:"kalit xato" };
  el.dataset.s = s;
  el.querySelector(".lbl").textContent = L[s]||s;
  el.title = note || ({
    connecting:"Onlayn bazaga ulanmoqda…",
    ok:"Belgilaringiz onlayn saqlandi. Istalgan qurilmada shu sahifani ochib kalitni kiritsangiz — o'sha holat chiqadi.",
    saving:"Saqlanmoqda…",
    off:"Internetga ulanib bo'lmadi. Belgilar shu qurilmada saqlanmoqda; aloqa tiklanganda o'zi yuboriladi.",
    device:"Onlayn saqlash yoqilmagan — belgilar faqat shu brauzerda. Yoqish uchun bosing.",
    bad:"Kalit noto'g'ri yoki muddati tugagan. Yangisini kiriting — bosing."
  })[s];
}

function saveLocal(){
  store.set("done",done); store.set("known",known);
  store.set("tasks",tasks); store.set("exok",exok); store.set("ts",LTS);
}
function touch(){ LTS = Date.now(); saveLocal(); push(); }

function ghHead(){
  return { "Authorization":"Bearer "+GH.tok, "Accept":"application/vnd.github+json",
           "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json" };
}
function payload(){
  return { v:1, ts:LTS, done:[...done], known:known, tasks:tasks, exok:exok };
}
function applyRemote(d){
  if(!d || typeof d!=="object") return false;
  const rts = +d.ts || 0;
  if(rts <= LTS) return false;
  done  = Array.isArray(d.done) ? d.done.filter(x=>typeof x==="number") : [];
  known = (d.known && typeof d.known==="object") ? d.known : {};
  tasks = (d.tasks && typeof d.tasks==="object") ? d.tasks : {};
  exok  = (d.exok  && typeof d.exok ==="object") ? d.exok  : {};
  LTS = rts; saveLocal(); repaint();
  return true;
}

function push(){
  if(!GH.tok) return;
  setSync("saving");
  clearTimeout(GH.timer);
  GH.timer = setTimeout(pushNow, 900);
}
async function pushNow(){
  if(!GH.tok) return;
  if(GH.busy){ GH.again = true; return; }
  GH.busy = true;
  try{
    const body = JSON.stringify({ files:{ [GIST_FILE]:{ content: JSON.stringify(payload()) } } });
    let res;
    if(GH.id){
      res = await fetch("https://api.github.com/gists/"+GH.id, {method:"PATCH", headers:ghHead(), body});
      if(res.status===404){ GH.id=null; store.set("gist",null); }
    }
    if(!GH.id){
      res = await fetch("https://api.github.com/gists", {method:"POST", headers:ghHead(),
        body: JSON.stringify({ description:GIST_TAG, public:false,
          files:{ [GIST_FILE]:{ content: JSON.stringify(payload()) } } })});
      if(res.ok){ const j = await res.json(); GH.id = j.id; store.set("gist", GH.id); }
    }
    GH.busy = false;
    if(res && (res.status===401 || res.status===403)){ setSync("bad"); return; }
    if(!res || !res.ok){ setSync("off"); return; }
    if(GH.again){ GH.again=false; pushNow(); } else setSync("ok");
  }catch(e){
    GH.busy = false; setSync("off");
    setTimeout(()=>{ if(GH.tok) pushNow(); }, 6000);
  }
}

async function ghConnect(){
  setSync("connecting");
  try{
    /* 1) saqlangan gist bormi? */
    if(GH.id){
      const r = await fetch("https://api.github.com/gists/"+GH.id, {headers:ghHead()});
      if(r.status===401 || r.status===403){ setSync("bad"); return; }
      if(r.ok){ return ghAfterLoad(await r.json()); }
      GH.id = null; store.set("gist", null);
    }
    /* 2) ro'yxatdan izlash */
    const r2 = await fetch("https://api.github.com/gists?per_page=100", {headers:ghHead()});
    if(r2.status===401 || r2.status===403){ setSync("bad"); return; }
    if(!r2.ok){ setSync("off"); return; }
    const list = await r2.json();
    const hit = (list||[]).find(g => g && g.description === GIST_TAG);
    if(hit){
      const r3 = await fetch("https://api.github.com/gists/"+hit.id, {headers:ghHead()});
      if(r3.ok){ return ghAfterLoad(await r3.json()); }
    }
    /* 3) topilmadi — yangisini yaratamiz */
    GH.id = null; setSync("ok"); pushNow();
  }catch(e){ setSync("off"); }
}
function ghAfterLoad(g){
  GH.id = g.id; store.set("gist", GH.id);
  let d = null;
  try{
    const f = g.files && g.files[GIST_FILE];
    if(f && f.content) d = JSON.parse(f.content);
  }catch(e){}
  const took = applyRemote(d);
  const rts = d ? (+d.ts||0) : 0;
  if(!took && LTS > rts) pushNow(); else setSync("ok");
}

function initSync(){
  try{ localStorage.setItem("ok_probe","1"); localStorage.removeItem("ok_probe"); }
  catch(e){
    setSync("off","Bu brauzer saqlashga ruxsat bermayapti (yashirin rejim). Oddiy oynada oching.");
    return;
  }
  GH.tok = store.get("ghtok", null);
  GH.id  = store.get("gist", null);
  if(!GH.tok){ setSync("device"); showKeyBar(); return; }
  ghConnect();
}

/* ---------- kalit oynasi ---------- */
function showKeyBar(force){
  if(!force && store.get("keyhide", 0)) return;
  const p = document.getElementById("keybar");
  if(p) p.hidden = false;
}
function setKey(tok){
  tok = (tok||"").trim();
  if(!tok) return false;
  GH.tok = tok; store.set("ghtok", tok); store.set("keyhide", 1);
  const p = document.getElementById("keybar"); if(p) p.hidden = true;
  ghConnect();
  return true;
}
function clearKey(){
  GH.tok = null; GH.id = null;
  store.set("ghtok", null); store.set("gist", null); store.set("keyhide", 0);
  setSync("device"); showKeyBar(true);
}

/* ---------- speech ---------- */
let voiceRU = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices()||[];
    voiceRU = vs.find(v=>/^ru/i.test(v.lang)) || null;
  }catch(e){}
}
if (typeof speechSynthesis !== "undefined"){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function say(text, btn){
  const t = plain(text).replace(/<[^>]*>/g,"");
  if (typeof speechSynthesis === "undefined") return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "ru-RU"; u.rate = 0.85;
    if (voiceRU) u.voice = voiceRU;
    if (btn){ btn.classList.add("playing"); u.onend = ()=>btn.classList.remove("playing"); }
    speechSynthesis.speak(u);
  }catch(e){}
}
function sayBtn(text){ return `<button class="say" data-say="${esc(plain(text))}" title="Talaffuzini eshitish" aria-label="Talaffuzini eshitish">🔊</button>`; }

function rTable(b){
  const head = b.cols.map(c=>`<th>${c}</th>`).join("");
  const body = b.rows.map(r=>`<tr>${r.map((cell,i)=>{
    const k = (b.kinds&&b.kinds[i])||"plain";

  const solved = new Set(exok["w"+wk]||[]);
  const items = b.items.map((it,i)=>{
    const n = i+1;
    let body="";
    if(it.ty==="mc"){
      body = `<div class="opts">${it.o.map((o,j)=>`<button class="opt" data-mc="${i}" data-j="${j}">${o}</button>`).join("")}</div>`;
    } else if(it.ty==="in"){
      body = `<div class="row"><input class="inp" data-in="${i}" placeholder="javobingiz…" autocomplete="off" spellcheck="false"><button class="mini" data-chk="${i}">Tekshirish</button></div>`;
    } else if(it.ty==="tr"){
      body = `<div class="row"><button class="mini" data-rev="${i}">Javobni ko'rsatish</button></div>`;
    } else if(it.ty==="dict"){
      body = `<div class="row"><button class="mini" data-say="${esc(it.a)}">🔊 Eshitish</button><input class="inp" data-in="${i}" placeholder="kirill harflarida yozing…" autocomplete="off" spellcheck="false"><button class="mini" data-chk="${i}">Tekshirish</button></div>`;
    }
    return `<div class="ex ${solved.has(i)?"solved":""}" data-ex="${i}"><div class="ex-head"><div class="ex-n">${n}.</div><div class="ex-q">${it.q}</div></div>
      <div class="ex-body">${body}<div class="fb" data-fb="${i}"></div></div></div>`;
  }).join("");
  return `<section class="blk"><h3 class="sec">${b.h}<span class="tag">${b.items.length} ta</span></h3>${b.note?`<p class="sec-note">${b.note}</p>`:""}
    <div id="exwrap">${items}</div>
    <div class="row" style="margin-top:14px"><button class="mini" id="exreset">Mashqlarni tozalash</button><span id="exscore" class="sec-note" style="margin:0">To'g'ri bajarildi: ${solved.size} / ${b.items.length}</span></div></section>`;
}

/* ---------- topshiriq belgilash ---------- */
/* Faqat amaliy bloklar topshiriq hisoblanadi (nazariy matn va qoidalar emas). */
const TASKABLE = { alphabet:1, table:1, drill:1, vocab:1, phrases:1, dialog:1, flash:1, text:1, ex:1 };
const TASKLBL = {
  alphabet:"Alifboni o'qib chiqdim", table:"Jadvalni o'rgandim", drill:"Mashqni ovoz chiqarib bajardim",
  vocab:"So'zlarni yodladim", phrases:"Iboralarni yodladim", dialog:"Dialogni yod oldim",
  flash:"Flashkartlarni aylantirdim", text:"Matnni o'qib tarjima qildim", ex:"Mashqlarni bajardim"
};
function taskId(n,bi){ return "w"+n+".b"+bi; }
function taskBar(n,bi,ty){
  const id = taskId(n,bi), on = !!tasks[id];
  return `<div class="taskbar"><button class="tchk ${on?"on":""}" data-task="${id}" data-ty="${ty}" aria-pressed="${on}">
    <span class="bx">${on?"✓":""}</span><span class="lb">${on?"Bajarildi":(TASKLBL[ty]||"Bajardim")}</span></button></div>`;
}
function paintTask(btn){
  const on = !!tasks[btn.dataset.task];
  btn.classList.toggle("on", on);
  btn.setAttribute("aria-pressed", on?"true":"false");
  btn.querySelector(".bx").textContent = on ? "✓" : "";
  const ty = (btn.dataset.ty)||"";
  btn.querySelector(".lb").textContent = on ? "Bajarildi" : (TASKLBL[ty]||"Bajardim deb belgilash");
}
/* haftadagi topshiriqlar soni va bajarilgani */
function weekTasks(n){
  const w = WEEKS[n]; if(!w) return {t:0,d:0};
  let t=0,d=0;
  w.blocks.forEach((b,bi)=>{ if(TASKABLE[b.t]){ t++; if(tasks[taskId(n,bi)]) d++; } });
  return {t,d};
}
let _fixed = null;   // o'zgarmas jami: topshiriq, mashq, so'z soni
function totals(){
  if(!_fixed){
    _fixed = {t:0, ex:0, vw:0};
    for(let n=1;n<=39;n++){
      const w=WEEKS[n]; if(!w) continue;
      w.blocks.forEach(b=>{ if(TASKABLE[b.t]) _fixed.t++; });
      const e=w.blocks.find(x=>x.t==="ex"); if(e) _fixed.ex += e.items.length;
      _fixed.vw += allWords(n).length;
    }
  }
  let d=0,exd=0,kw=0;
  for(let n=1;n<=39;n++){
    if(!WEEKS[n]) continue;
    d   += weekTasks(n).d;
    exd += (exok["w"+n]||[]).length;
    kw  += (known["w"+n]||[]).length;
  }
  return {t:_fixed.t, ex:_fixed.ex, vw:_fixed.vw, d, exd, kw};
}
function nextWeek(){ for(let n=1;n<=39;n++) if(!done.includes(n)) return n; return 39; }

function renderWeek(n){
  const w = WEEKS[n];
  if(!w){
    const m = SYLLABUS.find(s=>n>=s.w[0]&&n<=s.w[1]);
    return `<p class="eyebrow">${n}-hafta</p><h2 class="wk-title">Bu hafta hali tayyorlanmoqda</h2>
      <div class="soon"><b>${m?m.name:""}</b>${m?`${m.w[0]}–${m.w[1]}-haftalar. Modullar ketma-ket qo'shib boriladi — 1-modul tayyor, keyingisi navbatda.`:""}</div>
      <div class="footnav"><button class="pill" data-go="${n-1}">← Oldingi</button><button class="pill" data-go="0">Dasturga qaytish</button></div>`;
  }
  const goals = `<div class="goalbox"><h4>Hafta oxirida siz</h4><ul>${w.goals.map(g=>`<li>${g}</li>`).join("")}</ul></div>`;
  const blocks = w.blocks.map((b,bi)=>{
    let h = "";
    switch(b.t){
      case "prose":    h = rProse(b); break;
      case "rule":     h = rRule(b); break;
      case "table":    h = rTable(b); break;
      case "alphabet": h = rAlphabet(b); break;
      case "drill":    h = rDrill(b); break;
      case "vocab":    h = rVocab(b,n); break;
      case "phrases":  h = rPhrases(b); break;
      case "dialog":   h = rDialog(b); break;
      case "flash":    h = rFlash(b,n); break;
      case "text":     h = rText(b); break;
      case "ex":       h = rEx(b,n); break;
      default: return "";
    }
    if(TASKABLE[b.t] && /<\/section>\s*$/.test(h))
      h = h.replace(/<\/section>\s*$/, taskBar(n,bi,b.t)+"</section>");
    return h;
  }).join("");
  const wt = weekTasks(n);
  const bar = `<div class="taskbar" style="border-top:0;margin:0 0 26px;padding:0">
    <div style="flex:1;max-width:var(--measure)">
      <div class="progress-label" style="color:var(--ink-3);font-size:11.5px;display:flex;justify-content:space-between;margin-bottom:6px">
        <span>Shu haftaning topshiriqlari</span><span id="wkt">${wt.d} / ${wt.t}</span></div>
      <div class="bar"><i id="wkbar" style="width:${wt.t?Math.round(wt.d/wt.t*100):0}%;background:var(--good)"></i></div>
    </div></div>`;
  const prev = n>1 ? `<button class="pill" data-go="${n-1}">← ${n-1}-hafta</button>` : `<button class="pill" data-go="0">← Dastur</button>`;
  const next = n<39 ? `<button class="pill primary" data-go="${n+1}">${n+1}-hafta →</button>` : `<span></span>`;
  return `<p class="eyebrow">${n}-hafta · ${w.lvl}</p><h2 class="wk-title">${w.title}</h2>
    <p class="lede">${w.lede}</p>${goals}${bar}${blocks}
    <div class="footnav">${prev}${next}</div>`;
}

/* ---------- per-week interactive ---------- */
let FC = null;
function allWords(n){
  const w = WEEKS[n]; const out=[];
  w.blocks.forEach(b=>{ if(b.t==="vocab") b.groups.forEach(g=>g.rows.forEach(r=>out.push(r))); });
  return out;
}
function initWeek(n){
  const w = WEEKS[n];
  if(!document.getElementById("fccard")) { bindEx(n); return; }
  const words = allWords(n);
  const kkey = "w"+n;
  const kn = new Set(known[kkey]||[]);
  FC = { words, i:0, order:[], kkey };
  FC.order = words.map((_,i)=>i).filter(i=>!kn.has(i));
  if(!FC.order.length) FC.order = words.map((_,i)=>i);
  shuffle(FC.order);
  drawFC();
  bindEx(n);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function drawFC(){
  if(!FC || !FC.order.length) return;
  if(FC.i >= FC.order.length) FC.i = 0;
  const r = FC.words[FC.order[FC.i]];
  document.getElementById("fcfront").textContent = stress(r[0]);
  document.getElementById("fctr").textContent = "";
  const back = document.getElementById("fcback");
  back.textContent = r[2]; back.hidden = true;
  document.getElementById("fchint").textContent = "Kartani bosing — javobni ko'rish";
  document.getElementById("fcpos").textContent = `${FC.i+1} / ${FC.order.length}`;
  const kn = (known[FC.kkey]||[]).length;
  document.getElementById("fcleft").textContent = `bilganlar: ${kn} / ${FC.words.length}`;
}
function flipFC(){
  const back = document.getElementById("fcback");
  if(!back) return;
  back.hidden = !back.hidden;
  const r = FC.words[FC.order[FC.i]];
  document.getElementById("fctr").textContent = back.hidden ? "" : r[1];
  document.getElementById("fchint").textContent = back.hidden ? "Kartani bosing — javobni ko'rish" : "Bildingizmi? Pastdagi tugmani tanlang";
}
function nextFC(gotIt){
  if(!FC) return;
  const idx = FC.order[FC.i];
  if(gotIt){
    const set = new Set(known[FC.kkey]||[]); set.add(idx);
    known[FC.kkey] = [...set]; touch(); syncNav();
    FC.order.splice(FC.i,1);
    if(!FC.order.length){ document.getElementById("fcfront").textContent="Hammasi bajarildi ✓";
      document.getElementById("fcback").hidden=true; document.getElementById("fchint").textContent="Bu haftaning barcha so'zlarini bilasiz."; return; }
    if(FC.i>=FC.order.length) FC.i=0;
  } else {
    FC.i = (FC.i+1) % FC.order.length;
  }
  drawFC();
}

  el.innerHTML = msg;
}

/* ---------- nusxalash va ko'chirish kodi ---------- */
function copyText(txt, cb){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>cb(true)).catch(()=>cb(fallbackCopy(txt)));
      return;
    }
  }catch(e){}
  cb(fallbackCopy(txt));
}
function fallbackCopy(txt){
  try{
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}
function mkCode(){
  const s = JSON.stringify({v:1, ts:LTS, done, known, tasks, exok});
  try{ return "OK1." + btoa(unescape(encodeURIComponent(s))); }catch(e){ return "OK0."+s; }
}
function useCode(code){
  try{
    let s;
    if(code.indexOf("OK1.")===0) s = decodeURIComponent(escape(atob(code.slice(4))));
    else if(code.indexOf("OK0.")===0) s = code.slice(4);
    else return false;
    const d = JSON.parse(s);
    if(!d || typeof d!=="object") return false;
    done  = Array.isArray(d.done) ? d.done.filter(x=>typeof x==="number") : [];
    known = (d.known && typeof d.known==="object") ? d.known : {};
    tasks = (d.tasks && typeof d.tasks==="object") ? d.tasks : {};
    exok  = (d.exok  && typeof d.exok ==="object") ? d.exok  : {};
    touch();
    return true;
  }catch(e){ return false; }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const tk = e.target.closest("[data-task]");
  if(tk){
    const id = tk.dataset.task;
    if(tasks[id]) delete tasks[id]; else tasks[id] = 1;
    paintTask(tk); touch();
    syncNav();
    if(current>0){
      const wt = weekTasks(current);
      const wb = document.getElementById("wkbar"), wtx = document.getElementById("wkt");
      if(wb) wb.style.width = (wt.t?Math.round(wt.d/wt.t*100):0)+"%";
      if(wtx) wtx.textContent = `${wt.d} / ${wt.t}`;
    }
    return;
  }

  const t = e.target.closest("[data-go]");
  if(t){ go(+t.dataset.go); return; }

  const s = e.target.closest("[data-say]");
  if(s){ say(s.dataset.say, s); return; }

  const mh = e.target.closest(".mod-head");
  if(mh && !mh.dataset.go){ mh.parentElement.classList.toggle("open"); return; }

  const pd = e.target.closest("[data-playdlg]");
  if(pd){
    const lines = [...pd.closest("section").querySelectorAll(".turn .r")].map(x=>x.textContent);
    let k=0; const step=()=>{ if(k>=lines.length) return; const u=new SpeechSynthesisUtterance(plain(lines[k]).replace("🔊",""));
      u.lang="ru-RU"; u.rate=0.85; if(voiceRU)u.voice=voiceRU; u.onend=()=>{k++;step();}; speechSynthesis.speak(u); };
    speechSynthesis.cancel(); step(); return;
  }

  const tx = e.target.closest("[data-txt]");
  if(tx){
    const box = tx.closest("section");
    const hid = box.querySelector(".tx-uz").hidden;
    box.querySelectorAll(".tx-uz").forEach(x=>x.hidden = !hid);
    tx.textContent = hid ? "Tarjimani yashirish" : "Tarjimani ko'rsatish";
    return;
  }
  const pt = e.target.closest("[data-playtxt]");
  if(pt){
    const lines = [...pt.closest("section").querySelectorAll(".tx-ru")].map(x=>x.textContent);
    let k=0; const step=()=>{ if(k>=lines.length) return; const u=new SpeechSynthesisUtterance(plain(lines[k]).replace("🔊",""));
      u.lang="ru-RU"; u.rate=0.9; if(voiceRU)u.voice=voiceRU; u.onend=()=>{k++;step();}; speechSynthesis.speak(u); };
    speechSynthesis.cancel(); step(); return;
  }
  if(e.target.closest("#fccard")){ flipFC(); return; }
  if(e.target.id==="fcyes"){ nextFC(true); return; }
  if(e.target.id==="fcno"){ nextFC(false); return; }
  if(e.target.id==="fcsay"){ const r=FC.words[FC.order[FC.i]]; say(r[0]); return; }
  if(e.target.id==="fcreset"){ known[FC.kkey]=[]; touch(); syncNav(); FC.order=FC.words.map((_,i)=>i); shuffle(FC.order); FC.i=0; drawFC(); return; }

  const mc = e.target.closest("[data-mc]");
  if(mc){
    const i=+mc.dataset.mc, j=+mc.dataset.j, it=EX[i];
    const box = mc.closest(".ex");
    box.querySelectorAll("[data-mc]").forEach(x=>x.disabled=true);
    if(j===it.a){ mc.classList.add("right"); fb(i,true,"To'g'ri. "+(it.w||"")); recEx(current,i); }
    else{ mc.classList.add("wrong"); box.querySelector(`[data-j="${it.a}"]`).classList.add("right");
      fb(i,false,"Noto'g'ri. "+(it.w||"")); }
    return;
  }

  const ck = e.target.closest("[data-chk]");
  if(ck){
    const i=+ck.dataset.chk, it=EX[i];
    const inp = document.querySelector(`[data-in="${i}"]`);
    const val = norm(inp.value);
    const ans = (Array.isArray(it.a)?it.a:[it.a]).map(norm);
    if(!val){ fb(i,false,"Avval javob yozing."); return; }
    if(ans.includes(val)){ inp.classList.remove("wrong"); inp.classList.add("right"); fb(i,true,"To'g'ri. "+(it.w||"")); recEx(current,i); }
    else{ inp.classList.remove("right"); inp.classList.add("wrong");
      fb(i,false,`Noto'g'ri. To'g'ri javob: <span class="corr">${Array.isArray(it.a)?it.a[0]:it.a}</span>. ${it.w||""}`); }
    return;
  }

  const rv = e.target.closest("[data-rev]");
  if(rv){
    const i=+rv.dataset.rev, it=EX[i];
    fb(i,true,`<span class="corr">${stress(it.a)}</span>`);
    rv.disabled = true; rv.textContent = "Ko'rsatildi";
    return;
  }

  if(e.target.id==="exreset"){
    document.querySelectorAll(".fb").forEach(x=>{x.className="fb";x.innerHTML="";});
    document.querySelectorAll(".opt[data-mc]").forEach(x=>{x.disabled=false;x.classList.remove("right","wrong");});
    document.querySelectorAll("[data-in]").forEach(x=>{x.value="";x.classList.remove("right","wrong");});
    document.querySelectorAll("[data-rev]").forEach(x=>{x.disabled=false;x.textContent="Javobni ko'rsatish";});
    return;
  }

  if(e.target.id==="doneBtn"){
    if(current<=0) return;
    if(done.includes(current)) done = done.filter(x=>x!==current);
    else done = [...done, current];
    touch(); syncNav(); return;
  }
  if(e.target.id==="wipeBtn"){
    if(!confirm("Barcha belgilar (tugatilgan haftalar, topshiriqlar, mashqlar, bilingan so'zlar) o'chiriladi. Davom etamizmi?")) return;
    done=[]; known={}; tasks={}; exok={}; touch(); go(-1); return;
  }
  if(e.target.closest("#syncBtn")){
    if(GH.tok && (GH.state==="ok"||GH.state==="saving"||GH.state==="off")) { pushNow(); return; }
    showKeyBar(true);
    const el = document.getElementById("keyIn"); if(el) el.focus();
    return;
  }

  /* --- kalit paneli (yuqoridagi tasma) --- */
  if(e.target.id==="keySet"){
    const inp = document.getElementById("keyIn");
    const fbx = document.getElementById("keyFb");
    if(!setKey(inp.value)) { fbx.textContent = "Kalitni qo'ying."; return; }
    inp.value = ""; return;
  }
  if(e.target.id==="keySkip"){
    store.set("keyhide", 1);
    document.getElementById("keybar").hidden = true; return;
  }
  /* --- kalit paneli (Natijalarim sahifasi) --- */
  if(e.target.id==="keySet2"){
    const inp = document.getElementById("keyIn2");
    const fbx = document.getElementById("keyFb2");
    if(!setKey(inp.value)){ fbx.textContent = "Kalitni qo'ying."; return; }
    inp.value = ""; fbx.textContent = "Yoqildi ✓";
    document.getElementById("keyState").textContent = "yoqilgan";
    return;
  }
  if(e.target.id==="keyOff"){
    clearKey();
    const st = document.getElementById("keyState"); if(st) st.textContent = "yoqilmagan";
    const fbx = document.getElementById("keyFb2"); if(fbx) fbx.textContent = "Bu qurilmadan o'chirildi.";
    return;
  }

  /* --- ko'chirish kodi (do'stlar nusxasida) --- */
  if(e.target.id==="codeGet"){
    document.getElementById("codeBox").value = mkCode();
    document.getElementById("codeFb").textContent = "Kod tayyor — nusxalang.";
    return;
  }
  if(e.target.id==="codeCopy"){
    const box = document.getElementById("codeBox");
    if(!box.value) box.value = mkCode();
    copyText(box.value, ok=>{ document.getElementById("codeFb").textContent = ok?"Nusxalandi ✓":"Qo'lda belgilab nusxalang."; });
    return;
  }
  if(e.target.id==="codePut"){
    const v = (document.getElementById("codeBox").value||"").trim();
    const fbx = document.getElementById("codeFb");
    if(!v){ fbx.textContent = "Avval kodni qo'ying."; return; }
    if(useCode(v)){ fbx.textContent = "Yuklandi ✓"; go(-1); }
    else fbx.textContent = "Kod noto'g'ri yoki buzilgan.";
    return;
  }
  if(e.target.id==="menuBtn"){ document.getElementById("rail").classList.toggle("open"); return; }
  if(e.target.id==="themeBtn"){
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", isDark?"light":"dark");
    store.set("theme", isDark?"light":"dark"); return;
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.matches("[data-in]")){
    const i = e.target.dataset.in;
    const btn = document.querySelector(`[data-chk="${i}"]`);
    if(btn) btn.click();
  }
});

/* ---------- boot ---------- */
(function(){
  const th = store.get("theme", null);
  if(th) document.documentElement.setAttribute("data-theme", th);
  buildNav();
  go(current);
  initSync();
})();

</script>
</body></html>
